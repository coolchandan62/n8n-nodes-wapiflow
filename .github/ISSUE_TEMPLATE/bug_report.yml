name: Bug Report
description: Something isn't working with the WapiFlow node or trigger
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
        
        Before filing, please check:
        - Your WapiFlow API Key is **not revoked** (dashboard → API Keys)
        - You're on the **latest** `n8n-nodes-wapiflow` version (`npm ls n8n-nodes-wapiflow`)
        - The issue isn't a WapiFlow platform bug (if it is, please file at [wapiflow/wapiflow](https://wapiflow.com/support) instead)

  - type: input
    id: node-version
    attributes:
      label: n8n-nodes-wapiflow version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: n8n-version
    attributes:
      label: n8n version
      placeholder: "1.60.0"
    validations:
      required: true

  - type: input
    id: wapiflow-version
    attributes:
      label: WapiFlow instance version
      description: Visible at the bottom of your WapiFlow dashboard footer
      placeholder: "2.4.1"

  - type: dropdown
    id: node-affected
    attributes:
      label: Which node is affected?
      options:
        - WapiFlow (action node)
        - WapiFlow Trigger (webhook)
        - Credentials
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add WapiFlow node to a workflow
        2. Set operation to "Send Media"
        3. ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output (n8n console / node execution tab)
      render: shell
